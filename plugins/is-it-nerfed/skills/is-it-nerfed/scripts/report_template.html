<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>$title</title>
<style>
@font-face {
  font-family: "Geist";
  src: url("data:font/woff2;base64,$font") format("woff2");
  font-weight: 100 900;
  font-display: swap;
}
:root {
  color-scheme: light;
  /* All text uses --ink. Grays are only for lines, fills and muted marks, never for text. */
  --page: #f1f0ec;
  --surface: #fdfdfc;
  --sunken: #f5f4f0;
  --tile: #ecebe5;
  --ink: #121211;
  --line: #e4e2db;
  --axis: #c9c6bc;
  --muted-mark: #cfccc2;
  --series: #2f6fd0;
  --window: rgba(18, 18, 17, 0.035);
  --window-now: rgba(47, 111, 208, 0.07);
  --good: #1d8a3c;
  --warning: #d99a00;
  --critical: #cc3a33;
  --neutral: #6f6c64;
  --good-wash: #e5f3e8;
  --warning-wash: #fbf0d4;
  --critical-wash: #fae6e4;
  --neutral-wash: #eae8e2;
  --shadow: 0 1px 2px rgba(60, 50, 30, 0.05), 0 8px 24px -6px rgba(60, 50, 30, 0.10);
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* Radius scale: cards 18px, inner tiles and chips 10px, status pills fully round. */
  --radius: 18px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 17px/1.5 var(--sans);
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
main { max-width: 60rem; margin: 0 auto; padding: 3.5rem 1.25rem 5rem; display: grid; gap: 1rem; }
h1 { font-size: 3.25rem; line-height: 1.05; font-weight: 700; letter-spacing: -0.04em; margin: 0; text-wrap: balance; }
h2 { font-size: 1.2rem; line-height: 1.3; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
h3 { font-size: 1.05rem; font-weight: 650; margin: 1.75rem 0 0.75rem; }
p { margin: 0 0 0.5rem; max-width: 64ch; text-wrap: pretty; }
.icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round; }

header { padding-bottom: 1rem; }
.product { font-size: 1rem; font-weight: 600; margin: 0 0 0.6rem; }
.windows { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.25rem; }
.chip { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.75rem 0.35rem 0.6rem;
  border-radius: var(--radius-sm); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  font-size: 0.95rem; font-weight: 500; white-space: nowrap; }
.chip .icon { width: 18px; height: 18px; }
.chip strong { font-weight: 650; }

.tile { display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none;
  border-radius: var(--radius-sm); background: var(--tile); }
.tile .icon { width: 22px; height: 22px; }

.status { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.95rem; font-weight: 650;
  padding: 0.25rem 0.7rem 0.25rem 0.5rem; border-radius: 999px; white-space: nowrap; background: var(--neutral-wash); }
.status .icon { width: 18px; height: 18px; stroke-width: 2.5; }
.status.good { background: var(--good-wash); }
.status.warning { background: var(--warning-wash); }
.status.critical { background: var(--critical-wash); }
.status.good .icon { stroke: var(--good); }
.status.warning .icon { stroke: var(--warning); }
.status.critical .icon { stroke: var(--critical); }
.status.neutral .icon { stroke: var(--neutral); }

.verdict { display: grid; grid-template-columns: auto 1fr; gap: 1.5rem; align-items: start;
  padding: 2rem 2.25rem; border-radius: var(--radius); background: var(--neutral-wash); }
.verdict.good { background: var(--good-wash); }
.verdict.warning { background: var(--warning-wash); }
.verdict.critical { background: var(--critical-wash); }
.verdict-icon { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 16px;
  background: var(--neutral); box-shadow: var(--shadow); }
.verdict.good .verdict-icon { background: var(--good); }
.verdict.warning .verdict-icon { background: var(--warning); }
.verdict.critical .verdict-icon { background: var(--critical); }
.verdict-icon .icon { width: 34px; height: 34px; stroke: var(--surface); stroke-width: 2.5; }
.verdict-word { font-size: 1.1rem; font-weight: 700; margin: 0.1rem 0 0.4rem; }
.verdict-text { font-size: 2rem; line-height: 1.2; font-weight: 650; letter-spacing: -0.025em; margin: 0 0 1.25rem;
  max-width: 28ch; }
.confidence { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.6rem; margin: 0; max-width: none; }
.confidence strong { font-weight: 650; }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 20px; height: 8px; border-radius: 4px; background: rgba(18, 18, 17, 0.14); }
.meter i.on { background: var(--ink); }

.categories { display: grid; grid-template-columns: 1.1fr 1fr; gap: 1rem;
  grid-template-areas: "mistakes behavior" "mistakes setup" "code code"; }
.category { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 1.5rem 1.6rem 1.6rem; display: flex; flex-direction: column; }
.category.mistakes { grid-area: mistakes; }
.category.behavior { grid-area: behavior; }
.category.setup { grid-area: setup; }
.category.code { grid-area: code; }
.category-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.85rem;
  margin-bottom: 1rem; }

.caption { display: block; font-size: 0.95rem; font-weight: 500; }
.figures { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1.25rem; margin: auto 0; padding: 1.5rem 0; }
.figure { display: block; font-size: 4.75rem; line-height: 0.95; font-weight: 300; letter-spacing: -0.05em; }
.figure.now { font-weight: 700; }
.arrow { font-size: 1.75rem; line-height: 1; padding-bottom: 2.1rem; }
.bars { display: grid; gap: 0.6rem; margin-top: auto; padding: 1rem; border-radius: var(--radius-sm);
  background: var(--sunken); }
.bar-row { display: grid; grid-template-columns: 3.75rem 1fr; align-items: center; }
.bar-track { display: block; }
.bar { display: block; height: 16px; border-radius: 0 6px 6px 0; }
.bar.before { background: var(--muted-mark); }
.bar.now { background: var(--series); }
.delta { align-self: flex-start; margin-top: 0.4rem; font-size: 0.95rem; font-weight: 700; padding: 0.2rem 0.65rem;
  border-radius: var(--radius-sm); background: var(--neutral-wash); }
.delta.good { background: var(--good-wash); }
.delta.warning { background: var(--warning-wash); }
.delta.critical { background: var(--critical-wash); }

.signals { list-style: none; margin: 0.5rem 0 0; padding: 0; display: grid; }
.signal-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.75rem 0; }
.signal-row + .signal-row { border-top: 1px solid var(--line); }
.signal-row strong { display: block; font-weight: 650; }
.tag { font-size: 0.95rem; font-weight: 650; padding: 0.2rem 0.65rem; border-radius: var(--radius-sm);
  white-space: nowrap; background: var(--neutral-wash); }
.tag.good { background: var(--good-wash); }
.tag.warning { background: var(--warning-wash); }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
.facts li { display: flex; gap: 0.65rem; align-items: flex-start; padding: 0.75rem 0.9rem;
  border-radius: var(--radius-sm); background: var(--sunken); overflow-wrap: anywhere; }
.facts .icon { margin-top: 0.1rem; }

.section-head { display: grid; grid-template-columns: auto 1fr; gap: 0.85rem; align-items: center; }
.section-head .meta { margin: 0.1rem 0 0; }
.trend { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 1.5rem 1.6rem 1.4rem; }
figure { margin: 1.5rem 0 0; }
.chart-box { position: relative; height: 300px; }
.legend { list-style: none; padding: 0; margin: 1rem 0 0; display: flex; flex-wrap: wrap; gap: 0.4rem 1.5rem;
  font-size: 0.95rem; }
.key { display: inline-block; vertical-align: middle; margin-right: 0.45rem; }
.key.roll { width: 18px; height: 3px; border-radius: 2px; background: var(--series); }
.key.avg { width: 18px; height: 0; border-top: 2px dashed var(--ink); }
.key.version { width: 0; height: 14px; border-left: 2px dotted var(--neutral); }
.key.incident { width: 0; height: 14px; border-left: 2px solid var(--critical); }

details { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
details:first-of-type { margin-top: 1.5rem; }
summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: auto 1fr auto; gap: 0.85rem;
  align-items: center; padding: 1rem 1.6rem; border-radius: var(--radius); transition: background 200ms ease; }
summary::-webkit-details-marker { display: none; }
summary::after { content: ""; width: 9px; height: 9px; margin-right: 0.35rem; border-right: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink); transform: translateY(-3px) rotate(45deg); transition: transform 200ms ease; }
summary:hover { background: var(--sunken); }
summary:focus-visible { outline: 2px solid var(--series); outline-offset: 2px; }
.summary-title { font-size: 1.1rem; font-weight: 650; }
details[open] summary { border-radius: var(--radius) var(--radius) 0 0; }
details[open] summary::after { transform: translateY(2px) rotate(-135deg); }
.details-body { padding: 0.5rem 1.6rem 1.6rem; }
.details-body > :first-child { margin-top: 0; }
.note { font-weight: 500; }

.receipts { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.receipts h3 { margin-top: 0.75rem; }
.receipt { position: relative; margin: 0 0 0.75rem; padding: 1rem 1.1rem 1rem 3.1rem; border-radius: var(--radius-sm);
  background: var(--sunken); }
.receipt .icon { position: absolute; left: 1rem; top: 1.05rem; width: 22px; height: 22px; stroke: var(--series); }
.receipt blockquote { margin: 0 0 0.4rem; font-size: 1.1rem; font-weight: 600; line-height: 1.35; }
.receipt figcaption { font-size: 0.95rem; }
.receipt figcaption strong { font-weight: 650; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1rem; }
.stat { padding: 1rem 1.1rem; border-radius: var(--radius-sm); background: var(--sunken); }
.stat strong { display: block; margin-top: 0.25rem; font-size: 1.6rem; line-height: 1.1; font-weight: 700;
  letter-spacing: -0.02em; }
table { border-collapse: collapse; width: 100%; font-size: 1rem; }
th, td { text-align: left; padding: 0.6rem 0.75rem; vertical-align: top; }
thead th { font-weight: 650; border-bottom: 2px solid var(--ink); }
tbody tr:nth-child(odd) { background: var(--sunken); }
th[scope="row"] { font-weight: 500; }
td { overflow-wrap: anywhere; }
.changes { display: grid; gap: 0.6rem; }
.change { display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: start; padding: 1rem 1.1rem;
  border-radius: var(--radius-sm); background: var(--sunken); }
.change p { margin: 0; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.steps li { display: flex; gap: 0.85rem; align-items: center; padding: 0.9rem 1rem; border-radius: var(--radius-sm);
  background: var(--sunken); }
.steps .tile { background: var(--surface); }
.steps li:last-child:nth-child(odd) { grid-column: 1 / -1; }

#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 0.9rem;
  padding: 0.35rem 0.6rem; border-radius: 6px; opacity: 0; transform: translate(-50%, -130%); white-space: nowrap;
  transition: opacity 150ms ease; }
#tip.on { opacity: 1; }

@media (prefers-reduced-motion: no-preference) {
  main > * { animation: rise 500ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  main > :nth-child(2) { animation-delay: 60ms; }
  main > :nth-child(3) { animation-delay: 120ms; }
  main > :nth-child(n+4) { animation-delay: 180ms; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
}
@media (max-width: 760px) {
  main { padding: 2rem 1rem 3rem; }
  h1 { font-size: 2.4rem; }
  .verdict { grid-template-columns: 1fr; gap: 1rem; padding: 1.5rem 1.25rem; }
  .verdict-icon { width: 52px; height: 52px; border-radius: 14px; }
  .verdict-icon .icon { width: 28px; height: 28px; }
  .verdict-text { font-size: 1.5rem; }
  .categories { grid-template-columns: 1fr; grid-template-areas: "mistakes" "behavior" "setup" "code"; }
  .category, .trend { padding: 1.25rem; }
  .figure { font-size: 3.25rem; }
  summary { padding: 0.9rem 1.25rem; }
  .details-body { padding: 0.5rem 1.25rem 1.25rem; }
  .details-body table { display: block; overflow-x: auto; }
  .receipts, .steps { grid-template-columns: 1fr; gap: 0.75rem; }
  .stats { grid-template-columns: 1fr; }
  .change { grid-template-columns: 1fr; gap: 0.5rem; }
  .chart-box { height: 240px; }
}
@media print {
  main > * { animation: none; }
  .category, .trend, details { box-shadow: none; border: 1px solid var(--line); }
  details { break-inside: avoid; }
  #tip { display: none; }
}
</style>
</head>
<body>
<main>
$header
$verdict
$categories
$trend
$details
</main>
<div id="tip" role="tooltip"></div>
<script id="trend-data" type="application/json">$trend_data</script>
<script>
$chartjs
</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById("trend-data").textContent);
  var canvas = document.getElementById("trend");
  if (!data || !canvas || !window.Chart) return;
  var css = getComputedStyle(document.documentElement);
  var color = function (name) { return css.getPropertyValue(name).trim(); };
  var font = { family: color("--sans"), size: 13 };
  // Shades the Before and Now windows, then draws Claude Code versions and incidents as vertical lines.
  var guides = {
    id: "guides",
    beforeDatasetsDraw: function (chart) {
      var c = chart.ctx, area = chart.chartArea, x = chart.scales.x;
      data.windows.forEach(function (w) {
        var x0 = Math.max(area.left, x.getPixelForValue(w.start) - 4);
        var x1 = Math.min(area.right, x.getPixelForValue(w.end) + 4);
        c.fillStyle = w.label === "Now" ? color("--window-now") : color("--window");
        c.fillRect(x0, area.top, x1 - x0, area.bottom - area.top);
        c.fillStyle = color("--ink");
        c.font = "600 13px " + font.family;
        c.fillText(w.label + ": average " + Math.round(w.avg) + "%", x0 + 6, area.top - 8);
      });
    },
    afterDatasetsDraw: function (chart) {
      var c = chart.ctx, area = chart.chartArea, x = chart.scales.x;
      data.markers.forEach(function (m) {
        var px = x.getPixelForValue(m.i);
        c.save();
        c.strokeStyle = m.kind === "incident" ? color("--critical") : color("--neutral");
        c.lineWidth = m.kind === "incident" ? 2 : 1.5;
        c.setLineDash(m.kind === "incident" ? [] : [2, 3]);
        c.beginPath(); c.moveTo(px, area.top); c.lineTo(px, area.bottom); c.stroke();
        c.restore();
      });
    }
  };
  var averages = data.windows.map(function (w) {
    return {
      label: w.label + " average",
      data: data.labels.map(function (_, i) { return i >= w.start && i <= w.end ? w.avg : null; }),
      borderColor: color("--ink"), borderWidth: 1.5, borderDash: [6, 4], pointRadius: 0, pointHitRadius: 0
    };
  });
  new Chart(canvas, {
    type: "line",
    data: {
      labels: data.labels,
      datasets: [{
        label: "5-day rate", data: data.rate, borderColor: color("--series"), borderWidth: 2.5,
        tension: 0.35, pointRadius: 0, pointHoverRadius: 5, pointHoverBackgroundColor: color("--series"),
        fill: "origin",
        backgroundColor: function (ctx) {
          var area = ctx.chart.chartArea;
          if (!area) return "transparent";
          var g = ctx.chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
          g.addColorStop(0, "rgba(47, 111, 208, 0.22)");
          g.addColorStop(1, "rgba(47, 111, 208, 0)");
          return g;
        }
      }].concat(averages)
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: { padding: { top: 22 } },
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: color("--ink"), padding: 12, displayColors: false,
          titleFont: { family: font.family, size: 14, weight: "650" }, bodyFont: { family: font.family, size: 14 },
          footerFont: { family: font.family, size: 14, weight: "500" },
          filter: function (item) { return item.raw !== null; },
          callbacks: {
            label: function (item) {
              if (item.datasetIndex > 0) return item.dataset.label + ": " + item.raw + "%";
              var n = data.counts[item.dataIndex];
              var day = n ? n[0] + " of " + n[1] + " prompts that day. " : "";
              return day + "5-day rate: " + item.raw + "%";
            },
            footer: function (items) {
              var i = items[0].dataIndex;
              return data.markers.filter(function (m) { return m.i === i; }).map(function (m) { return m.label; });
            }
          }
        }
      },
      scales: {
        x: { grid: { display: false }, border: { color: color("--axis") },
             ticks: { color: color("--ink"), font: font, maxRotation: 0, autoSkipPadding: 24 } },
        y: { beginAtZero: true, grace: "10%", border: { display: false },
             grid: { color: color("--line") },
             ticks: { color: color("--ink"), font: font, maxTicksLimit: 4,
                      callback: function (v) { return v + "%"; } } }
      }
    },
    plugins: [guides]
  });
})();
</script>
<script>
(function () {
  var tip = document.getElementById("tip");
  document.addEventListener("pointerover", function (e) {
    var el = e.target.closest("[data-tip]");
    if (!el) return;
    tip.textContent = el.getAttribute("data-tip");
    var box = el.getBoundingClientRect();
    tip.style.left = box.left + box.width / 2 + "px";
    tip.style.top = box.top + "px";
    tip.classList.add("on");
  });
  document.addEventListener("pointerout", function (e) {
    if (e.target.closest("[data-tip]")) tip.classList.remove("on");
  });
})();
</script>
</body>
</html>
