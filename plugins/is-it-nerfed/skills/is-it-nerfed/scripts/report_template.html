<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>$title</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --series: #2a78d6;
  --series-2: #898781;
  --window: rgba(11, 11, 11, 0.035);
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --neutral: #898781;
  --muted-mark: #c3c2b7;
  --window-now: rgba(42, 120, 214, 0.06);
  --good-wash: #eaf6ea;
  --good-edge: #bfe3bf;
  --warning-wash: #fdf3dc;
  --warning-edge: #f3d892;
  --critical-wash: #fbeaea;
  --critical-edge: #efc0c0;
  --neutral-wash: #efeeea;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.55 var(--sans); }
main { max-width: 52rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
h1 { font-size: 2rem; line-height: 1.15; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
h2 { font-size: 1.05rem; font-weight: 650; margin: 0; }
h3 { font-size: 0.95rem; font-weight: 650; margin: 1.5rem 0 0.5rem; }
p { margin: 0 0 0.5rem; max-width: 65ch; }
.product { color: var(--ink-2); font-weight: 600; margin: 0 0 0.25rem; }
.meta { color: var(--ink-2); font-size: 0.92rem; }
header { margin-bottom: 1.75rem; }
header .meta { margin-top: 0.4rem; }

.status { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.85rem; font-weight: 600;
  color: var(--ink); white-space: nowrap; }
.status svg { width: 18px; height: 18px; fill: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
.status.good svg { stroke: var(--good); }
.status.warning svg { stroke: var(--warning); }
.status.critical svg { stroke: var(--critical); }
.status.neutral svg { stroke: var(--neutral); }

.verdict { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1.5rem 1.75rem; }
.verdict.good { background: var(--good-wash); border-color: var(--good-edge); }
.verdict.warning { background: var(--warning-wash); border-color: var(--warning-edge); }
.verdict.critical { background: var(--critical-wash); border-color: var(--critical-edge); }
.verdict .status { font-size: 1rem; }
.verdict .status svg { width: 22px; height: 22px; }
.verdict-text { font-size: 1.5rem; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em; margin: 0.6rem 0 0.75rem; }
.confidence { color: var(--ink-2); margin: 0; }
.confidence strong { color: var(--ink); font-weight: 600; margin-right: 0.35rem; }

.categories { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin-top: 1.25rem;
  background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.category { background: var(--surface); padding: 1.25rem 1.5rem 1.4rem; }
.category-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
.category p { color: var(--ink-2); }

.caption { display: block; color: var(--ink-3); font-size: 0.82rem; }
.figures { display: flex; align-items: center; gap: 1.25rem; margin: 1rem 0 0.75rem; }
.figure { display: block; font-size: 2.4rem; line-height: 1; font-weight: 650; letter-spacing: -0.02em; color: var(--ink-3); }
.figure.now { color: var(--ink); }
.arrow { color: var(--ink-3); font-size: 1.4rem; }
.bars { display: grid; gap: 0.45rem; }
.bar-row { display: grid; grid-template-columns: 3.5rem 1fr; align-items: center; }
.bar-track { display: block; }
.bar { display: block; height: 12px; border-radius: 0 4px 4px 0; }
.bar.before { background: var(--muted-mark); }
.bar.now { background: var(--series); }
.signals { list-style: none; margin: 0.9rem 0 0; padding: 0; display: grid; gap: 0.7rem; }
.signal-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.signal-row strong { display: block; font-weight: 600; font-size: 0.95rem; }
.tag { font-size: 0.82rem; font-weight: 650; padding: 0.2rem 0.6rem; border-radius: 999px; white-space: nowrap;
  font-variant-numeric: tabular-nums; }
.tag.good { background: var(--good-wash); }
.tag.warning { background: var(--warning-wash); }
.tag.neutral { background: var(--neutral-wash); color: var(--ink-2); }

.trend { margin-top: 2.5rem; }
.trend .meta { margin-top: 0.25rem; }
figure { margin: 1rem 0 0; }
.chart-box { position: relative; height: 280px; }
.legend { list-style: none; padding: 0; margin: 0.6rem 0 0; display: flex; flex-wrap: wrap; gap: 0.3rem 1.2rem;
  color: var(--ink-2); font-size: 0.85rem; }
.key { display: inline-block; vertical-align: middle; margin-right: 0.4rem; }
.key.roll { width: 16px; height: 3px; border-radius: 2px; background: var(--series); }
.key.avg { width: 16px; height: 0; border-top: 1.5px dashed var(--ink); }
.key.version { width: 0; height: 12px; border-left: 1.5px dashed var(--ink-3); }
.key.incident { width: 0; height: 12px; border-left: 1.5px solid var(--critical); }

details { margin-top: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 0 1.25rem; }
details:first-of-type { margin-top: 2.5rem; }
summary { cursor: pointer; font-weight: 600; padding: 0.9rem 0; }
details[open] { padding-bottom: 1.25rem; }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 0.4rem 0.75rem 0.4rem 0; vertical-align: top; }
thead th { color: var(--ink-3); font-weight: 600; border-bottom: 1px solid var(--grid); }
th[scope="row"] { font-weight: 400; color: var(--ink-2); }
td { overflow-wrap: anywhere; }
dl { margin: 0; }
dt { font-weight: 600; margin-top: 0.75rem; }
dd { margin: 0.1rem 0 0; }
dd span { display: block; color: var(--ink-2); font-size: 0.9rem; }
.receipts { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.receipt { margin: 0 0 1rem; }
.receipt blockquote { margin: 0 0 0.35rem; padding-left: 0.75rem; border-left: 2px solid var(--grid); }
.receipt blockquote::before { content: "\201C"; }
.receipt blockquote::after { content: "\201D"; }
.receipt figcaption { color: var(--ink-2); font-size: 0.88rem; }

#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--page); font-size: 0.8rem;
  padding: 0.3rem 0.55rem; border-radius: 6px; opacity: 0; transform: translate(-50%, -130%); white-space: nowrap; }
#tip.on { opacity: 1; }

@media (max-width: 680px) {
  .categories { grid-template-columns: 1fr; }
  .receipts { grid-template-columns: 1fr; gap: 0; }
  .verdict { padding: 1.25rem; }
  .verdict-text { font-size: 1.15rem; }
  .chart-box { height: 220px; }
}
@media print {
  details { break-inside: avoid; }
  #tip { display: none; }
}
</style>
</head>
<body>
<main>
$header
$verdict
$categories
$trend
$details
</main>
<div id="tip" role="tooltip"></div>
<script id="trend-data" type="application/json">$trend_data</script>
<script>
$chartjs
</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById("trend-data").textContent);
  var canvas = document.getElementById("trend");
  if (!data || !canvas || !window.Chart) return;
  var css = getComputedStyle(document.documentElement);
  var color = function (name) { return css.getPropertyValue(name).trim(); };
  var font = { family: color("--sans"), size: 11 };
  // Shades the Before and Now windows, then draws Claude Code versions and incidents as vertical lines.
  var guides = {
    id: "guides",
    beforeDatasetsDraw: function (chart) {
      var c = chart.ctx, area = chart.chartArea, x = chart.scales.x;
      data.windows.forEach(function (w) {
        var x0 = Math.max(area.left, x.getPixelForValue(w.start) - 4);
        var x1 = Math.min(area.right, x.getPixelForValue(w.end) + 4);
        c.fillStyle = w.label === "Now" ? color("--window-now") : color("--window");
        c.fillRect(x0, area.top, x1 - x0, area.bottom - area.top);
        c.fillStyle = color("--ink-2");
        c.font = "600 12px " + font.family;
        c.fillText(w.label + ": average " + Math.round(w.avg) + "%", x0 + 6, area.top - 8);
      });
    },
    afterDatasetsDraw: function (chart) {
      var c = chart.ctx, area = chart.chartArea, x = chart.scales.x;
      data.markers.forEach(function (m) {
        var px = x.getPixelForValue(m.i);
        c.save();
        c.strokeStyle = m.kind === "incident" ? color("--critical") : color("--ink-3");
        c.setLineDash(m.kind === "incident" ? [] : [3, 3]);
        c.beginPath(); c.moveTo(px, area.top); c.lineTo(px, area.bottom); c.stroke();
        c.restore();
      });
    }
  };
  var averages = data.windows.map(function (w) {
    return {
      label: w.label + " average",
      data: data.labels.map(function (_, i) { return i >= w.start && i <= w.end ? w.avg : null; }),
      borderColor: color("--ink"), borderWidth: 1.5, borderDash: [6, 4], pointRadius: 0, pointHitRadius: 0
    };
  });
  new Chart(canvas, {
    type: "line",
    data: {
      labels: data.labels,
      datasets: [{
        label: "5-day rate", data: data.rate, borderColor: color("--series"), borderWidth: 2.5,
        tension: 0.35, pointRadius: 0, pointHoverRadius: 5, pointHoverBackgroundColor: color("--series"),
        fill: "origin",
        backgroundColor: function (ctx) {
          var area = ctx.chart.chartArea;
          if (!area) return "transparent";
          var g = ctx.chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
          g.addColorStop(0, "rgba(42, 120, 214, 0.22)");
          g.addColorStop(1, "rgba(42, 120, 214, 0)");
          return g;
        }
      }].concat(averages)
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: { padding: { top: 22 } },
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: color("--ink"), padding: 10, displayColors: false,
          titleFont: { family: font.family, weight: "600" }, bodyFont: { family: font.family },
          filter: function (item) { return item.raw !== null; },
          callbacks: {
            label: function (item) {
              if (item.datasetIndex > 0) return item.dataset.label + ": " + item.raw + "%";
              var n = data.counts[item.dataIndex];
              var day = n ? n[0] + " of " + n[1] + " prompts that day. " : "";
              return day + "5-day rate: " + item.raw + "%";
            }
          }
        }
      },
      scales: {
        x: { grid: { display: false }, border: { color: color("--axis") },
             ticks: { color: color("--ink-3"), font: font, maxRotation: 0, autoSkipPadding: 24 } },
        y: { beginAtZero: true, grace: "10%", border: { display: false },
             grid: { color: color("--grid") },
             ticks: { color: color("--ink-3"), font: font, maxTicksLimit: 4,
                      callback: function (v) { return v + "%"; } } }
      }
    },
    plugins: [guides]
  });
})();
</script>
<script>
(function () {
  var tip = document.getElementById("tip");
  document.addEventListener("pointerover", function (e) {
    var el = e.target.closest("[data-tip]");
    if (!el) return;
    tip.textContent = el.getAttribute("data-tip");
    var box = el.getBoundingClientRect();
    tip.style.left = box.left + box.width / 2 + "px";
    tip.style.top = box.top + "px";
    tip.classList.add("on");
  });
  document.addEventListener("pointerout", function (e) {
    if (e.target.closest("[data-tip]")) tip.classList.remove("on");
  });
})();
</script>
</body>
</html>
