<!doctype html>
<!-- Source of preview.png (1280x640). Render: chrome --headless=new --window-size=1280,640 --screenshot=preview.png preview.html -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
:root { --bg:#E9EEF4; --ink:#0F1B33; --ink2:#3A4A66; --base:#7D8BA3; --bad:#E0312F; --card:#FFFFFF; }
* { box-sizing:border-box; margin:0; }
html,body { width:1280px; height:640px; background:var(--bg); color:var(--ink); overflow:hidden; }
body { font-family:"Bricolage Grotesque",sans-serif; display:grid; grid-template-columns:540px 1fr; gap:48px; padding:72px 72px 64px; }
h1 { font-weight:800; font-size:112px; line-height:.9; letter-spacing:-.028em; }
.lede { margin-top:30px; font-size:29px; line-height:1.32; font-weight:500; color:var(--ink2); max-width:450px; text-wrap:balance; }
.cmd { margin-top:40px; display:inline-block; font:700 26px "JetBrains Mono",monospace; background:var(--ink); color:#fff; padding:14px 22px; border-radius:10px; }
.panel { background:var(--card); border-radius:22px; padding:34px 36px 30px; align-self:center; box-shadow:0 1px 0 #cfd8e4, 0 24px 48px -28px rgba(15,27,51,.35); }
.panel h2 { font-size:22px; font-weight:500; color:var(--ink2); }
svg { display:block; margin-top:14px; }
.verdict { margin-top:18px; padding-top:20px; border-top:2px solid var(--bg); font:500 22px/1.45 "JetBrains Mono",monospace; }
.verdict b { color:var(--bad); font-weight:700; }
</style></head>
<body>
<div>
  <h1>Is it<br>nerfed?</h1>
  <p class="lede">Your own Claude Code logs tell you if the model got worse for you.</p>
  <div class="cmd">/is-it-nerfed</div>
</div>
<div class="panel">
  <h2>Prompts where you had to correct the model</h2>
  <svg width="476" height="250" viewBox="0 0 476 250" font-family="JetBrains Mono" font-size="16">
    <!-- y: 0% at 220, 20% at 20 -> 10px per % -->
    <line x1="0" y1="220" x2="476" y2="220" stroke="#D5DDE8" stroke-width="2"/>
    <!-- baseline window -->
    <g fill="var(--base)">
      <circle cx="24"  cy="134" r="7"/><circle cx="66"  cy="124" r="7"/><circle cx="108" cy="136" r="7"/>
      <circle cx="150" cy="122" r="7"/><circle cx="192" cy="130" r="7"/>
    </g>
    <line x1="10" y1="130" x2="206" y2="130" stroke="var(--base)" stroke-width="4" stroke-linecap="round"/>
    <text x="10" y="102" fill="var(--base)" font-weight="700" font-size="26">9%</text>
    <text x="10" y="244" fill="var(--ink2)">before</text>
    <!-- recent window -->
    <g fill="var(--bad)">
      <circle cx="284" cy="78" r="7"/><circle cx="326" cy="64" r="7"/><circle cx="368" cy="74" r="7"/>
      <circle cx="410" cy="62" r="7"/><circle cx="452" cy="72" r="7"/>
    </g>
    <line x1="270" y1="70" x2="466" y2="70" stroke="var(--bad)" stroke-width="4" stroke-linecap="round"/>
    <text x="270" y="42" fill="var(--bad)" font-weight="700" font-size="26">15%</text>
    <text x="270" y="244" fill="var(--ink2)">last 2 weeks</text>
  </svg>
  <p class="verdict"><b>Nerfed for you.</b> Opus is slightly<br>worse for you (78% probability).</p>
</div>
</body></html>
